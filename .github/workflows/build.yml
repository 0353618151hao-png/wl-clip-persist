name: Build Binary Maximum Optimized for Lenovo 80MH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (Mold, Wayland, LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libclang-dev mold clang upx

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo for Extreme Optimization
        run: |
          mkdir -p .cargo
          cat <<EOF > .cargo/config.toml
          [profile.release]
          opt-level = 3
          lto = "fat"
          codegen-units = 1
          panic = "abort"
          strip = "symbols"

          # Sửa lỗi proc-macro bằng cách hạ cấp tối ưu hóa cho công cụ build
          [profile.release.build-override]
          opt-level = 0
          lto = false

          [target.'cfg(all())']
          rustflags = [
            "-C", "target-cpu=silvermont",
            "-C", "link-arg=-fuse-ld=mold",
            "-C", "embed-bitcode=yes",
            "-C", "relocation-model=static",
            "-C", "llvm-args=-fp-contract=fast",
            "-C", "llvm-args=-simplifycfg-require-and-preserve-domtree"
          ]
          EOF

      - name: Build Release Binary
        run: cargo build --release

      - name: Compress with UPX
        run: |
          # Giảm kích thước file để load nhanh hơn trên ổ cứng HDD/eMMC của Lenovo 80MH
          upx --ultra --best target/release/wl-clip-persist

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: wl-clip-persist-LENOVO-80MH-SUPER-OPTIMIZED
          path: target/release/wl-clip-persist
