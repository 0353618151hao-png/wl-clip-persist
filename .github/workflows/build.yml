name: Build Binary Maximum Optimized for Lenovo 80MH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libclang-dev mold clang

      - name: Setup Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Fix .cargo/config.toml & Configure Cargo.toml Profile
        run: |
          # ═══ BƯỚC 1: Xóa [profile.*] khỏi .cargo/config.toml ═══
          if [ -f .cargo/config.toml ]; then
            python3 << 'PYEOF'
          import re
          with open('.cargo/config.toml', 'r') as f:
              content = f.read()
          sections = re.split(r'(?=^\[)', content, flags=re.MULTILINE)
          filtered = [s for s in sections if not s.strip().startswith('[profile.')]
          with open('.cargo/config.toml', 'w') as f:
              f.write(''.join(filtered))
          print("✓ Removed [profile.*] from .cargo/config.toml")
          PYEOF
          fi

          # ═══ BƯỚC 2: Sửa Cargo.toml ═══
          python3 << 'PYEOF'
          import re
          with open('Cargo.toml', 'r') as f:
              content = f.read()
          
          # Chèn khai báo unstable feature lên dòng đầu tiên (nếu chưa có)
          if 'cargo-features' not in content:
              content = 'cargo-features = ["panic-immediate-abort"]\n\n' + content
              
          sections = re.split(r'(?=^\[)', content, flags=re.MULTILINE)
          filtered = [s for s in sections if not s.strip().startswith('[profile.release]')]
          result = ''.join(filtered).rstrip() + """

          [profile.release]
          opt-level = 3
          lto = "fat"
          codegen-units = 1
          panic = "immediate-abort"
          strip = "symbols"
          """
          with open('Cargo.toml', 'w') as f:
              f.write(result)
          print("✓ Updated Cargo.toml with panic-immediate-abort")
          PYEOF

      - name: Build with Extreme Optimization
        run: |
          # ═══════════════════════════════════════════════════════════════
          #  TỐI ƯU CHO INTEL CELERON N2840 (Bay Trail / Silvermont)
          # ═══════════════════════════════════════════════════════════════

          export RUSTFLAGS="\
            -C target-cpu=silvermont \
            -C target-feature=+sse4.2,+popcnt \
            -C embed-bitcode=yes \
            -C link-arg=-fuse-ld=mold \
            -C link-arg=-Wl,--gc-sections \
            -C link-arg=-Wl,-O3 \
            -C link-arg=-Wl,--as-needed \
            -C link-arg=-Wl,--hash-style=gnu \
            -C link-arg=-Wl,--sort-common \
            -C llvm-args=-fp-contract=fast \
            -C llvm-args=-simplifycfg-require-and-preserve-domtree \
            -Z share-generics=y"

          # -Z build-std:          Build lại std và core từ source với cờ Silvermont
          #                         (std bản prebuilt chỉ tối ưu cho x86_64 generic)
          cargo +nightly build --release \
            -Z build-std=core,std \
            -Z unstable-options

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: wl-clip-persist-LENOVO-80MH-SUPER-OPTIMIZED
          path: target/release/wl-clip-persist
