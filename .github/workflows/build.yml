name: Build Binary Maximum Optimized for Lenovo 80MH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies & Mold Linker
        run: |
          sudo apt-get update
          # Cài thêm mold và clang để hỗ trợ liên kết thần tốc
          sudo apt-get install -y libwayland-dev libclang-dev mold clang

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with Extreme Optimization
        run: |
          # 1. target-cpu=silvermont: Chính xác cho Intel Celeron N2840/N2940 (Bay Trail).
          # 2. link-arg=-fuse-ld=mold: Dùng Mold để liên kết cực nhanh và tối ưu LTO.
          # 3. embed-bitcode=yes: Bắt buộc để fix lỗi incompatible với LTO.
          # 4. llvm-args=-fp-contract=fast: Tối ưu các phép toán số thực.
          # 5. strip=symbols: Xóa debug info ngay trong lúc build (gọn hơn bước strip rời).
          
          export RUSTFLAGS="-C target-cpu=silvermont \
                            -C link-arg=-fuse-ld=mold \
                            -C opt-level=3 \
                            -C lto=fat \
                            -C llvm-args=-simplifycfg-require-and-preserve-domtree \
                            -C codegen-units=1 \
                            -C embed-bitcode=yes \
                            -C llvm-args=-fp-contract=fast \
                            -C panic=abort \
                            -C strip=symbols \
                            -C relocation-model=static"
          
          cargo build --release

      - name: Post-Processing (UPX)
        run: |
          # Vì bạn chạy Wayland trên máy yếu, UPX giúp giảm I/O khi nạp chương trình vào RAM
          sudo apt-get install -y upx
          upx --ultra --best target/release/wl-clip-persist

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: wl-clip-persist-LENOVO-80MH-SUPER-OPTIMIZED
          path: target/release/wl-clip-persist
